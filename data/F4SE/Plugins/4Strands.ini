; Phase 0 spike (docs/SPIKE.md). Remove once the spike's questions are answered.
[Spike]
; Log every skinned mesh on the player after a load, and on each actor when a 4Stim scene starts.
ProbeBody = true
; Hang one test strand between two of the player's bones.
Strand = true
; Vanilla mesh whose shader the strand borrows, relative to Meshes\.
StrandTemplate = Interiors\Building\Glass\BldGlassGlow01.nif
StrandBoneA = LArm_Hand
StrandBoneB = RArm_Hand
StrandRadius = 0.4
; First argument to the engine's CreateDynamicTriShape; its meaning is unknown.
StrandDynamicFlags = 0
; Where BSDynamicTriShape keeps its vertex pointer. 0 finds it from the positions; set e.g. 0x180 to force a field.
StrandDynamicOffset = 0
StrandDynamicStride = 16
